[workspace]
members = [
    "bin/hermes-tern",
    "bin/testing",
    "crates/cli",
    "crates/core",
    "crates/gateway",
    "crates/ui",
    "crates/store",
    "crates/supervisor",
    "crates/omp",
]
default-members = ["bin/hermes-tern"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
hermes-tern-cli = { path = "crates/cli" }
hermes-tern-core = { path = "crates/core" }
hermes-tern-gateway = { path = "crates/gateway" }
hermes-tern-ui = { path = "crates/ui" }
hermes-tern-store = { path = "crates/store" }
hermes-tern-supervisor = { path = "crates/supervisor" }
hermes-tern-omp = { path = "crates/omp" }

tern-sdk = { git = "https://github.com/stencil-hq/tern-sdk", rev = "9e9c07463f4958b0c633424c9860aba499487d28" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tungstenite = "=0.30.0"
url = "2.5"
clap = { version = "=4.6.7", features = ["derive", "env"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
sha2 = "0.11"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
base64 = "0.23.1"
rustix = { version = "=0.38.44", features = ["event", "fs", "process"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
